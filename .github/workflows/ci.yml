name: ci

on:
  pull_request:
  push:
    branches: [main]

# Nothing is granted by default. Each job asks for what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.152
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The black-box contract tests and the fixture checks run here too:
      # they are ordinary integration tests of the workspace.
      - name: Test
        run: cargo nextest run --workspace --locked

  # The same tests with git 2.25, the oldest the scan supports (spec section
  # 5.3). Every other job has a current git, and an old one behaves
  # differently: it reads .gitattributes from the work tree, and in a partial
  # clone it downloads a missing object even when it is told not to. It
  # counts the lines of a change as a current git does (spec section 5.2),
  # and the history tests expect the same numbers here as in every other job.
  rust-old-git:
    name: rust (git 2.25)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Ubuntu 20.04 is the release that came with git 2.25. The image has no
    # git and no Rust, so the steps below install both. It is pinned by its
    # digest, as the actions are by their commits.
    container:
      image: ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
    permissions:
      contents: read
    defaults:
      run:
        # The default in a container is `sh`, which would not notice a
        # failure on the left of a pipe.
        shell: bash
    env:
      # In a container GitHub points HOME at a folder of its own. rustup
      # reports that as an error, in three lines, and then carries on.
      # /root is the home folder the image gives its user.
      HOME: /root
    steps:
      # This runs before any git is installed, so the files come through
      # GitHub's API. The old git below has known security bugs, and this
      # way it only ever reads the repositories that the tests build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `1:2.25.1-1ubuntu3` is the build Ubuntu 20.04 was released with. The
      # newest build of the package is also called 2.25.1, but a security
      # update gave it GIT_NO_LAZY_FETCH, which git 2.25 itself does not
      # have. With that build this job would pass without testing what a
      # scan does when git downloads regardless (spec section 8).
      - name: Install git 2.25.1, and what rustup and the build need
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            git=1:2.25.1-1ubuntu3 curl ca-certificates build-essential
      - name: Check that the tests will run with git 2.25
        run: git --version | tee /dev/stderr | grep -q '^git version 2\.25\.'
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs |
            sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - name: Test
        run: cargo test --workspace --locked

  viewer:
    name: viewer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm run lint
      - name: Type check
        run: pnpm --filter @fogline/viewer run typecheck
      - name: Test
        run: pnpm --filter @fogline/viewer run test
      - name: Build
        run: pnpm --filter @fogline/viewer run build

  launcher:
    name: launcher (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node 18 is the oldest version the launcher supports. Node 26 is
          # the one this repository develops on.
          - { node: 18, os: ubuntu-latest }
          - { node: 26, os: ubuntu-latest }
          - { node: 26, os: windows-latest }
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # The launcher has no dependencies, so there is nothing to install.
      - name: Test
        working-directory: npm/fogline
        run: node --test test/launcher.test.js

  # Builds the release binary on each of the five platforms and proves it
  # works the way a user gets it: packed, installed from tarballs, run by npx.
  pack-smoke:
    name: pack smoke (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The release targets, each on its native runner (spec section 5.8).
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml, and the target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Build the release binary
        run: cargo build --release --locked --target "$TARGET" -p fogline
      - name: Check that the Linux binary is static
        if: runner.os == 'Linux'
        run: file "target/$TARGET/release/fogline" | tee /dev/stderr | grep -q static
      - name: Test the packaging script
        run: node --test scripts/npm-pack.test.mjs
      - name: Pack, install into an empty project, run through npx
        env:
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: node scripts/pack-smoke.mjs "target/$TARGET/release/fogline$EXE"

  deny:
    name: dependency policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.20.2
      - name: Licences, advisories, banned crates, sources
        run: cargo deny check

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: zizmor@1.32.0
      - name: zizmor (security)
        run: zizmor --offline .github
      - name: actionlint (syntax)
        run: >
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
