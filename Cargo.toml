[workspace]
resolver = "3"
members = ["crates/fogline", "crates/fogline-core", "crates/fogline-testkit", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/ShreeBohara/fogline"

[workspace.dependencies]
fogline-core = { path = "crates/fogline-core", version = "0.0.1" }
fogline-testkit = { path = "crates/fogline-testkit" }

clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
